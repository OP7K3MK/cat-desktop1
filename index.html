<!doctype html><html><head><meta charset="utf-8"><title>Cat</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0}
#ui{position:fixed;display:none;width:280px;font:14px system-ui,Tahoma,sans-serif}
#bub{display:none;background:#fff;color:#222;border-radius:14px;padding:8px 12px;margin-bottom:6px;max-height:140px;overflow:auto;box-shadow:0 2px 8px #0004;unicode-bidi:plaintext}
#row{display:none;gap:4px}
#t{flex:1;padding:8px;border-radius:12px;border:0;outline:0;unicode-bidi:plaintext}
#m,#s{border:0;border-radius:12px;padding:0 10px;cursor:pointer;background:#fff}
.heart{position:fixed;font-size:22px;pointer-events:none;animation:up 1.6s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"><div id="bub"></div><div id="row"><input id="t" placeholder="..."><button id="m">🎤</button><button id="s">➤</button></div></div>
<script type="module" src="app.js"></script>
</body></html>
